<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container pt-5">
        <div class="text-center mb-3">
            <h1>Wyszukiwarka telefonów</h1>

            <p class="text-muted">
                Wpisz nazwisko, imię, nazwę jednostki, komórkę,
                stanowisko, pokój lub numer telefonu.
            </p>
        </div>
        <main>
            <div class="row justify-content-center mb-4">
                <div class="col-12 col-md-8 col-lg-6">
                    <form id="searchForm">
                        <div class="input-group">
                            <input id="searchInput" type="text" class="form-control" placeholder="Wpisz nazwisko, jednostkę lub telefon..." autocomplete="off">
                            <button type="submit" class="btn btn-primary">
                                Szukaj
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            <div id="resultsInfo" class="mb-3">
            </div>
            <div id="resultsTable" class="table-responsive d-none">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Imię i nazwisko</th>
                            <th>Jednostka</th>
                            <th>Komórka</th>
                            <th>Stanowisko</th>
                            <th>Pokój</th>
                            <th>Telefon</th>
                        </tr>
                    </thead>
                    <tbody id="results">
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
<script src="script.js"></script>

</html>
